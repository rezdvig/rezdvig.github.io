<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>С днём рождения, Валя!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#7fd3f2;--bg2:#fff4d6;--ink:#17334d;--card:rgba(255,255,255,.8);--accent:#e63946;--sea:#27a9d1;--sea2:#1488b0;--road:#3b4252}
body.night{--bg1:#04061a;--bg2:#251a5e;--ink:#f1efff;--card:rgba(22,18,66,.62);--sea:#14308a;--sea2:#0c2064;--road:#14172b}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{min-height:100svh;display:flex;flex-direction:column;overflow-x:hidden;font-family:Nunito,system-ui,sans-serif;font-weight:500;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));transition:color .8s}
#sky{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.4s;background:linear-gradient(180deg,#04061a,#251a5e);pointer-events:none}
body.night #sky{opacity:1}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.shoot{position:fixed;z-index:1;width:150px;height:2px;border-radius:2px;background:linear-gradient(90deg,#fff,rgba(255,255,255,0));transform:rotate(-35deg);opacity:0;animation:fall 1.3s ease-in forwards;pointer-events:none;filter:drop-shadow(0 0 6px #fff)}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(-35deg)}15%{opacity:1}100%{opacity:0;transform:translate(-520px,364px) rotate(-35deg)}}
#orb{position:fixed;z-index:1;top:calc(env(safe-area-inset-top,0px) + 18px);right:18px;width:64px;height:64px;border-radius:50%;background:#ffd54a;box-shadow:0 0 0 12px rgba(255,213,74,.3),0 0 40px #ffd54a;transition:all 1s}
body.night #orb{background:#f4f1ff;box-shadow:inset -14px -6px 0 #cfc8f4,0 0 30px rgba(220,215,255,.7)}
main{position:relative;z-index:2;width:100%;max-width:560px;margin:0 auto;padding:36px 18px 8px;text-align:center}
.cake{font-size:54px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
h1{margin:6px 0 18px;font-family:Pacifico,cursive;font-weight:400;line-height:1.15}
h1 .a{display:block;font-size:clamp(30px,9vw,46px)}
h1 .b{display:block;font-size:clamp(64px,24vw,120px);color:var(--accent);text-shadow:0 4px 0 rgba(0,0,0,.12)}
.w{display:inline-block;white-space:nowrap}
.l{display:inline-block;opacity:0;animation:drop .7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(-12deg)}to{opacity:1;transform:none}}
.stickers{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0 22px}
.stk{width:84px;height:84px;display:grid;place-items:center;border-radius:22px;background:rgba(255,255,255,.55);border:3px dashed var(--ink);color:var(--ink);font:800 26px/1 Nunito,sans-serif;text-align:center;transform:rotate(var(--r));animation:fl 3s ease-in-out infinite;animation-delay:var(--d);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
.stk small{display:block;font-size:12px;margin-top:2px}
.stk img{width:100%;height:100%;object-fit:contain}
.stk.has{width:124px;height:124px;background:none;border:0;overflow:visible;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 8px 8px rgba(0,0,0,.25))}
.stk.pop{animation:pop .5s}
@keyframes fl{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(calc(var(--r) * -1)) translateY(-7px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(15deg)}100%{transform:scale(1)}}
.card{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:26px;padding:20px 18px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.12);transition:background .8s}
.card p{margin:0 0 14px;font-size:18px;line-height:1.5}
.row{display:flex;gap:12px;align-items:center;margin:12px 0;font-size:17px;line-height:1.4}
.row i{font-style:normal;font-size:34px;flex:none;width:44px;text-align:center}
.btn{margin:26px 0 6px;font:800 18px Nunito,system-ui,sans-serif;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:16px 28px;box-shadow:0 6px 0 #a02631,0 12px 22px rgba(0,0,0,.25);cursor:pointer;transition:transform .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent;max-width:100%}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #a02631}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.scene{position:relative;z-index:2;margin-top:auto;padding-top:60px;padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden;background:linear-gradient(180deg,transparent,var(--sea) 62px)}
.sup{position:absolute;left:14%;top:6px;font-size:54px;animation:bob 2.6s ease-in-out infinite}
.sup2{left:auto;right:12%;top:22px;font-size:34px;animation-delay:-1s}
.wave{display:block;width:200%;height:46px;animation:slide 7s linear infinite;margin-bottom:-2px}
@keyframes slide{to{transform:translateX(-50%)}}
.sea{height:34px;background:var(--sea2)}
.road{position:relative;height:56px;background:var(--road);border-top:4px solid #fff3}
.road:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:4px dashed #fff8}
.car{position:absolute;bottom:6px;left:-80px;font-size:44px;transform:scaleX(-1);animation:drive 8s linear infinite}
@keyframes drive{to{left:calc(100% + 80px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.l{opacity:1}}
</style>
</head>

    <p>Пусть новый год жизни будет тёплым, ярким и полным приключений!</p>
    <div class="row"><i>💃</i><span>Самых лучших тренировок.</span></div>

</main>
<div class="scene" aria-hidden="true">
  <div class="sup">🏄</div><div class="sup sup2">🌊</div>
  <svg class="wave" viewBox="0 0 800 46" preserveAspectRatio="none"><path d="M0 24 Q50 0 100 24 T200 24 T300 24 T400 24 T500 24 T600 24 T700 24 T800 24 V46 H0Z" fill="var(--sea)"/></svg>
  <div class="sea"></div>
  <div class="road"><div class="car">🚗</div></div>
</div>
<script>
(function(){
  var sky=document.getElementById('sky'),btn=document.getElementById('toggle'),timer=null;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.split').forEach(function(el,k){
    var t=el.textContent,n=0;el.textContent='';
    t.split(' ').forEach(function(word){
      var w=document.createElement('span');w.className='w';
      word.split('').forEach(function(ch){
        var s=document.createElement('span');s.className='l';s.textContent=ch;
        s.style.animationDelay=(k*0.9+n*0.06)+'s';n++;w.appendChild(s);
      });
      el.appendChild(w);el.appendChild(document.createTextNode(' '));
    });
  });
  var f=document.createDocumentFragment();
  for(var i=0;i<90;i++){
    var d=document.createElement('div'),s=Math.random()*2.5+1;
    d.className='star';
    d.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+s+'px;height:'+s+'px;animation-delay:'+(-Math.random()*3)+'s;animation-duration:'+(2+Math.random()*3)+'s';
    f.appendChild(d);
  }
  sky.appendChild(f);
  function shoot(){
    var e=document.createElement('div');
    e.className='shoot';
    e.style.left=(30+Math.random()*80)+'vw';
    e.style.top=(-2+Math.random()*40)+'vh';
    e.addEventListener('animationend',function(){e.remove()});
    document.body.appendChild(e);
  }
  function loop(){shoot();timer=setTimeout(loop,500+Math.random()*1100)}
  btn.addEventListener('click',function(){
    var night=document.body.classList.toggle('night');
    btn.textContent=night?'☀️ Вернуть день':'✨ Включить звёздное небо';
    clearTimeout(timer);
    if(night&&!reduce){shoot();setTimeout(shoot,300);timer=setTimeout(loop,900)}
    else document.querySelectorAll('.shoot').forEach(function(e){e.remove()});
  });
  document.querySelectorAll('.stk').forEach(function(s){
    var img=s.querySelector('img'),inp=s.querySelector('input');
    function fill(){img.hidden=false;s.querySelector('span').hidden=true;s.classList.add('has')}
    if(img.getAttribute('src'))fill();
    inp.addEventListener('change',function(){
      var f=inp.files[0];if(!f)return;
      img.src=URL.createObjectURL(f);fill();
    });
    s.addEventListener('click',function(e){
      if(s.classList.contains('has')){
        e.preventDefault();
        s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');
      }
    });
  });
})();
</script>
